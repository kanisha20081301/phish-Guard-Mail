services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishguard}
      POSTGRES_USER: ${POSTGRES_USER:-phishguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phishguard -d phishguard']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-phishguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phishguard}
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./server
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-phishguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phishguard}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  client:
    build: ./client
    ports: ['5173:80']
    depends_on: [server]
volumes:
  postgres-data:
